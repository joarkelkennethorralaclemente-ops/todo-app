<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Tareas (SPA)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gestor de Tareas de Joarkel Orrala 🚀</h1>
    
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Nueva tarea..." required>
      <button type="submit">Agregar</button>
    </form>

    <div class="filter-box">
      <input type="text" id="filter-input" placeholder="Filtrar tareas en tiempo real...">
    </div>

    <ul id="task-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
